<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="730" viewBox="0 0 1240 730">
<rect width="1240" height="730" fill="#FCFAF7"/>
<defs><marker id="arrow_blue" markerWidth="10" markerHeight="10" refX="8.5" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,5 L0,10 Z" fill="#5B9FBE"/></marker><marker id="arrow_rose" markerWidth="10" markerHeight="10" refX="8.5" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,5 L0,10 Z" fill="#B97589"/></marker><marker id="arrow_muted" markerWidth="10" markerHeight="10" refX="8.5" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,5 L0,10 Z" fill="#70757A"/></marker><marker id="arrow_violet" markerWidth="10" markerHeight="10" refX="8.5" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,5 L0,10 Z" fill="#8177A8"/></marker></defs>
<text x="40" y="45" font-family="Noto Sans CJK SC, sans-serif" font-size="27" font-weight="700" fill="#2D3238" text-anchor="start"><tspan x="40" dy="0">候选由结果推进，轨迹由确定性工具处理</tspan></text>
<text x="40" y="84" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" fill="#70757A" text-anchor="start"><tspan x="40" dy="0">上层组织实验；下层执行同一套处理与核验规则</tspan></text>
<rect x="40" y="142" width="320" height="144" rx="10" fill="#FFFDFC" stroke="#5B9FBE" stroke-width="1.8" />
<text x="60" y="180" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="700" fill="#2D3238" text-anchor="start"><tspan x="60" dy="0">A  规划与诊断</tspan></text>
<text x="60" y="219" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="400" fill="#2D3238" text-anchor="start"><tspan x="60" dy="0">提出可比较的单项或组合</tspan><tspan x="60" dy="30.45">说明假设与下一步依据</tspan></text>
<rect x="460" y="142" width="320" height="144" rx="10" fill="#FFFDFC" stroke="#5B9FBE" stroke-width="1.8" />
<text x="480" y="180" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="700" fill="#2D3238" text-anchor="start"><tspan x="480" dy="0">B  执行与整理</tspan></text>
<text x="480" y="219" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="400" fill="#2D3238" text-anchor="start"><tspan x="480" dy="0">调用处理、搜索与评价工具</tspan><tspan x="480" dy="30.45">保存真实结果及点去向</tspan></text>
<rect x="880" y="142" width="320" height="144" rx="10" fill="#FFFDFC" stroke="#8177A8" stroke-width="1.8" />
<text x="900" y="180" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="700" fill="#2D3238" text-anchor="start"><tspan x="900" dy="0">C  独立核验</tspan></text>
<text x="900" y="219" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="400" fill="#2D3238" text-anchor="start"><tspan x="900" dy="0">核对原始参考与实际产物</tspan><tspan x="900" dy="30.45">判断可比性和采用条件</tspan></text>
<path d="M 360,214 L 460,214" fill="none" stroke="#5B9FBE" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow_blue)"/>
<text x="409" y="198" font-family="Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" fill="#5B9FBE" text-anchor="middle"><tspan x="409" dy="0">任务</tspan></text>
<path d="M 780,214 L 880,214" fill="none" stroke="#5B9FBE" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow_blue)"/>
<text x="830" y="198" font-family="Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" fill="#5B9FBE" text-anchor="middle"><tspan x="830" dy="0">结果</tspan></text>
<rect x="410" y="361" width="440" height="132" rx="10" fill="#FFFDFC" stroke="#5B9FBE" stroke-width="1.8" />
<text x="630" y="400" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" fill="#2D3238" text-anchor="middle"><tspan x="630" dy="0">分段与过滤 → 方向删除 → DP</tspan></text>
<text x="630" y="445" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="400" fill="#2D3238" text-anchor="middle"><tspan x="630" dy="0">计算实际轨迹、指标与参数对照</tspan></text>
<path d="M 620,286 L 620,361" fill="none" stroke="#5B9FBE" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow_blue)"/>
<text x="639" y="331" font-family="Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" fill="#5B9FBE" text-anchor="start"><tspan x="639" dy="0">执行</tspan></text>
<rect x="40" y="361" width="285" height="132" rx="10" fill="#FFFDFC" stroke="#70757A" stroke-width="1.8" />
<text x="62" y="399" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" fill="#2D3238" text-anchor="start"><tspan x="62" dy="0">原始输入与比较规则</tspan></text>
<text x="62" y="439" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" fill="#2D3238" text-anchor="start"><tspan x="62" dy="0">同一数据、窗口与指标</tspan><tspan x="62" dy="29.0">候选不能自行改写参考</tspan></text>
<path d="M 325,428 L 410,428" fill="none" stroke="#70757A" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow_muted)"/>
<path d="M 175,493 L 175,533 L 1038,533 L 1038,286" fill="none" stroke="#8177A8" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow_violet)"/>
<rect x="535" y="515" width="284" height="32" rx="10" fill="#FCFAF7" stroke="#FCFAF7" stroke-width="0" />
<text x="550" y="539" font-family="Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" fill="#8177A8" text-anchor="start"><tspan x="550" dy="0">独立取得同一原始参考</tspan></text>
<path d="M 1040,142 L 1040,113 L 200,113 L 200,142" fill="none" stroke="#8177A8" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow_violet)"/>
<rect x="475" y="99" width="300" height="32" rx="10" fill="#FCFAF7" stroke="#FCFAF7" stroke-width="0" />
<text x="490" y="122" font-family="Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" fill="#8177A8" text-anchor="start"><tspan x="490" dy="0">实测差异与下一步问题</tspan></text>
<rect x="40" y="585" width="1160" height="100" rx="10" fill="#FFFDFC" stroke="#DDE3E7" stroke-width="1.8" />
<text x="62" y="622" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" fill="#2D3238" text-anchor="start"><tspan x="62" dy="0">两类结果分别处理</tspan></text>
<text x="315" y="622" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" fill="#2D3238" text-anchor="start"><tspan x="315" dy="0">方法无收益或退化：保留负结果，不替换原方案</tspan></text>
<text x="315" y="660" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" fill="#2D3238" text-anchor="start"><tspan x="315" dy="0">实现错误：修正、重算并复验，再恢复未完成实验</tspan></text>
<text x="40" y="720" font-family="Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" fill="#70757A" text-anchor="start"><tspan x="40" dy="0">最终全量阶段使用选定的固定参数，不对每条记录重新调用模型或搜索。</tspan></text>
</svg>