<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- Process-build-only environment selection; no document/font-file edits. -->
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <selectfont><rejectfont>
    <pattern><patelt name="family"><string>Noto Sans CJK JP</string></patelt><patelt name="style"><string>Black</string></patelt></pattern>
    <pattern><patelt name="family"><string>Noto Sans CJK JP</string></patelt><patelt name="style"><string>DemiLight</string></patelt></pattern>
    <pattern><patelt name="family"><string>Noto Sans CJK JP</string></patelt><patelt name="style"><string>Light</string></patelt></pattern>
    <pattern><patelt name="family"><string>Noto Sans CJK JP</string></patelt><patelt name="style"><string>Medium</string></patelt></pattern>
    <pattern><patelt name="family"><string>Noto Sans CJK JP</string></patelt><patelt name="style"><string>Thin</string></patelt></pattern>
    <pattern><patelt name="family"><string>Noto Sans CJK SC</string></patelt><patelt name="style"><string>Black</string></patelt></pattern>
    <pattern><patelt name="family"><string>Noto Sans CJK SC</string></patelt><patelt name="style"><string>DemiLight</string></patelt></pattern>
    <pattern><patelt name="family"><string>Noto Sans CJK SC</string></patelt><patelt name="style"><string>Light</string></patelt></pattern>
    <pattern><patelt name="family"><string>Noto Sans CJK SC</string></patelt><patelt name="style"><string>Medium</string></patelt></pattern>
    <pattern><patelt name="family"><string>Noto Sans CJK SC</string></patelt><patelt name="style"><string>Thin</string></patelt></pattern>
    <pattern><patelt name="family"><string>Noto Sans CJK TC</string></patelt><patelt name="style"><string>Black</string></patelt></pattern>
    <pattern><patelt name="family"><string>Noto Sans CJK TC</string></patelt><patelt name="style"><string>DemiLight</string></patelt></pattern>
    <pattern><patelt name="family"><string>Noto Sans CJK TC</string></patelt><patelt name="style"><string>Light</string></patelt></pattern>
    <pattern><patelt name="family"><string>Noto Sans CJK TC</string></patelt><patelt name="style"><string>Medium</string></patelt></pattern>
    <pattern><patelt name="family"><string>Noto Sans CJK TC</string></patelt><patelt name="style"><string>Thin</string></patelt></pattern>
    <pattern><patelt name="family"><string>Noto Sans CJK HK</string></patelt><patelt name="style"><string>Black</string></patelt></pattern>
    <pattern><patelt name="family"><string>Noto Sans CJK HK</string></patelt><patelt name="style"><string>DemiLight</string></patelt></pattern>
    <pattern><patelt name="family"><string>Noto Sans CJK HK</string></patelt><patelt name="style"><string>Light</string></patelt></pattern>
    <pattern><patelt name="family"><string>Noto Sans CJK HK</string></patelt><patelt name="style"><string>Medium</string></patelt></pattern>
    <pattern><patelt name="family"><string>Noto Sans CJK HK</string></patelt><patelt name="style"><string>Thin</string></patelt></pattern>
    <pattern><patelt name="family"><string>Noto Sans CJK KR</string></patelt><patelt name="style"><string>Black</string></patelt></pattern>
    <pattern><patelt name="family"><string>Noto Sans CJK KR</string></patelt><patelt name="style"><string>DemiLight</string></patelt></pattern>
    <pattern><patelt name="family"><string>Noto Sans CJK KR</string></patelt><patelt name="style"><string>Light</string></patelt></pattern>
    <pattern><patelt name="family"><string>Noto Sans CJK KR</string></patelt><patelt name="style"><string>Medium</string></patelt></pattern>
    <pattern><patelt name="family"><string>Noto Sans CJK KR</string></patelt><patelt name="style"><string>Thin</string></patelt></pattern>
    <pattern><patelt name="family"><string>Noto Sans</string></patelt><patelt name="style"><string>Bold</string></patelt></pattern>
    <pattern><patelt name="family"><string>Noto Sans</string></patelt><patelt name="style"><string>Bold Italic</string></patelt></pattern>
  </rejectfont></selectfont>
</fontconfig>
