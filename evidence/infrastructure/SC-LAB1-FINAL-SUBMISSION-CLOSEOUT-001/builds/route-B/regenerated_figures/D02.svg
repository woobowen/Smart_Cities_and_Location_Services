<text x="752.5" y="183.0" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="19" font-weight="700" fill="#2D3238">研究优化</text>
<text x="752.5" y="207.0" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="17" font-weight="400" fill="#2D3238">执行与比较有效</text>
<text x="752.5" y="231.0" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="17" font-weight="400" fill="#2D3238">但收益不足、存在权衡或退化</text>
