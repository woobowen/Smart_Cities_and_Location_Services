<text x="500.0" y="45.0" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="19" font-weight="700" fill="#2D3238">检查当前结果：下一步处理什么？</text>
<text x="500.0" y="69.0" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="17" font-weight="400" fill="#2D3238">先区分实现错误与有效但无收益的候选</text>
<rect x="30" y="156" width="435" height="90" rx="7" fill="#FFFDFC" stroke="#5B9FBE" stroke-width="1.8"/>
<text x="247.5" y="183.0" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="19" font-weight="700" fill="#2D3238">工程修复</text>
<text x="247.5" y="207.0" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="17" font-weight="400" fill="#2D3238">错误输入、范围错配、工具失败</text>
<text x="247.5" y="231.0" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="17" font-weight="400" fill="#2D3238">修正实现与证据入口</text>
