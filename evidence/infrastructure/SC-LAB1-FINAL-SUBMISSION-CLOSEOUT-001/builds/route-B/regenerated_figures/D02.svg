<text x="247.5" y="518.0" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="17" font-weight="400" fill="#2D3238">重建受影响的结果与报告</text>
<rect x="535" y="456" width="435" height="88" rx="7" fill="#FFFDFC" stroke="#8177A8" stroke-width="1.8"/>
<text x="752.5" y="494.0" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="19" font-weight="700" fill="#2D3238">实测与裁决</text>
<text x="752.5" y="518.0" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="17" font-weight="400" fill="#2D3238">保留／条件保留／拒绝／回退／补证</text>
<rect x="30" y="620" width="435" height="74" rx="7" fill="#FFFDFC" stroke="#5B9FBE" stroke-width="1.8"/>
<text x="247.5" y="651.0" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="19" font-weight="700" fill="#2D3238">恢复当前Goal</text>
<text x="247.5" y="675.0" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="17" font-weight="400" fill="#2D3238">检查尚未完成的任务并继续执行</text>
