<text x="247.5" y="371.0" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="17" font-weight="400" fill="#2D3238">保留失败案例，修正代码或证据入口</text>
<rect x="535" y="310" width="435" height="86" rx="7" fill="#FFFDFC" stroke="#8177A8" stroke-width="1.8"/>
