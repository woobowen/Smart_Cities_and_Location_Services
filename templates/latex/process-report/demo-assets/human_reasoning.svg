<rect x="72" y="292" width="300" height="230" rx="16" fill="white" stroke="#DDE3E7" stroke-width="1.7"/><rect x="94" y="315" width="190" height="38" rx="19" fill="white" stroke="#5B9FBE" stroke-width="1.8"/><text x="109" y="341" font-family="Noto Sans CJK SC, Noto Sans CJK, Arial, sans-serif" font-size="18" font-weight="700" fill="#5B9FBE" text-anchor="start" opacity="1">GPT PROPOSAL</text><text x="94" y="382" font-family="Noto Sans CJK SC, Noto Sans CJK, Arial, sans-serif" font-size="32" font-weight="800" fill="#2D3238" text-anchor="start" opacity="1">统一阈值</text><text x="94" y="426" font-family="Noto Sans CJK SC, Noto Sans CJK, Arial, sans-serif" font-size="23" font-weight="400" fill="#70757A" text-anchor="start"><tspan x="94" dy="0">理由：实现简单，</tspan><tspan x="94" dy="31.05">可作为统一基线。</tspan></text><path d="M384,408 L475,408" fill="none" stroke="#A7AFB5" stroke-width="3" marker-end="url(#arrow)"/><rect x="485" y="250" width="720" height="500" rx="20" fill="white" stroke="#D49757" stroke-width="2.2"/><rect x="510" y="274" width="230" height="38" rx="19" fill="white" stroke="#D49757" stroke-width="1.8"/><text x="525" y="300" font-family="Noto Sans CJK SC, Noto Sans CJK, Arial, sans-serif" font-size="18" font-weight="700" fill="#D49757" text-anchor="start" opacity="1">HUMAN REASONING</text><rect x="520" y="330" width="650" height="92" rx="12" fill="#FFFDFC" stroke="#DDE3E7" stroke-width="1.2"/><rect x="538" y="346" width="7" height="60" rx="3.5" fill="#D49757"/><text x="560" y="368" font-family="Noto Sans CJK SC, Noto Sans CJK, Arial, sans-serif" font-size="20" font-weight="750" fill="#D49757" text-anchor="start" opacity="1">① 用户发现</text><text x="560" y="402" font-family="Noto Sans CJK SC, Noto Sans CJK, Arial, sans-serif" font-size="22" font-weight="500" fill="#2D3238" text-anchor="start" opacity="1">不同轨迹类型的运动状态与分布差异明显。</text><rect x="520" y="452" width="650" height="92" rx="12" fill="#FFFDFC" stroke="#DDE3E7" stroke-width="1.2"/><rect x="538" y="468" width="7" height="60" rx="3.5" fill="#D49757"/><text x="560" y="490" font-family="Noto Sans CJK SC, Noto Sans CJK, Arial, sans-serif" font-size="20" font-weight="750" fill="#D49757" text-anchor="start" opacity="1">② 用户判断</text><text x="560" y="524" font-family="Noto Sans CJK SC, Noto Sans CJK, Arial, sans-serif" font-size="22" font-weight="500" fill="#2D3238" text-anchor="start" opacity="1">统一阈值可能对某一类轨迹产生系统性偏差。</text><rect x="520" y="574" width="650" height="92" rx="12" fill="#FFFDFC" stroke="#DDE3E7" stroke-width="1.2"/><rect x="538" y="590" width="7" height="60" rx="3.5" fill="#D49757"/><text x="560" y="612" font-family="Noto Sans CJK SC, Noto Sans CJK, Arial, sans-serif" font-size="20" font-weight="750" fill="#D49757" text-anchor="start" opacity="1">③ 用户建议</text><text x="560" y="646" font-family="Noto Sans CJK SC, Noto Sans CJK, Arial, sans-serif" font-size="22" font-weight="500" fill="#2D3238" text-anchor="start" opacity="1">保留统一阈值作 baseline，同时增加分类参数方案。</text><path d="M1218,408 L1300,408" fill="none" stroke="#A7AFB5" stroke-width="3" marker-end="url(#arrow)"/><rect x="1310" y="292" width="302" height="230" rx="16" fill="white" stroke="#DDE3E7" stroke-width="1.7"/><rect x="1332" y="315" width="140" height="38" rx="19" fill="white" stroke="#8177A8" stroke-width="1.8"/><text x="1347" y="341" font-family="Noto Sans CJK SC, Noto Sans CJK, Arial, sans-serif" font-size="18" font-weight="700" fill="#8177A8" text-anchor="start" opacity="1">EVIDENCE</text><text x="1332" y="382" font-family="Noto Sans CJK SC, Noto Sans CJK, Arial, sans-serif" font-size="24" font-weight="650" fill="#2D3238" text-anchor="start"><tspan x="1332" dy="0">A/B 并行实验</tspan><tspan x="1332" dy="32.400000000000006">同数据 / 同指标</tspan><tspan x="1332" dy="32.400000000000006">同预算</tspan></text><rect x="210" y="824" width="1264" height="186" rx="16" fill="white" stroke="#DDE3E7" stroke-width="1.7"/><text x="238" y="868" font-family="Noto Sans CJK SC, Noto Sans CJK, Arial, sans-serif" font-size="20" font-weight="750" fill="#8177A8" text-anchor="start" opacity="1">结果解释</text><text x="238" y="907" font-family="Noto Sans CJK SC, Noto Sans CJK, Arial, sans-serif" font-size="25" font-weight="500" fill="#2D3238" text-anchor="start" opacity="1">如果分类参数在预先约定指标上更稳定，则采用；否则保留统一方案。</text><rect x="238" y="946" width="555" height="38" rx="19" fill="#D7D3EA" stroke="#8177A8" stroke-width="1.2"/><text x="260" y="972" font-family="Noto Sans CJK SC, Noto Sans CJK, Arial, sans-serif" font-size="18" font-weight="800" fill="#8177A8" text-anchor="start" opacity="1">FINAL DECISION = DATA + HUMAN INTERPRETATION</text><line x1="72" y1="1110" x2="1612" y2="1110" stroke="#DDE3E7" stroke-width="1.5"/><text x="72" y="1146" font-family="Noto Sans CJK SC, Noto Sans CJK, Arial, sans-serif" font-size="18" font-weight="400" fill="#70757A" text-anchor="start" opacity="1">适用：AI 批判、参数选择、用户纠正 GPT 等核心 Human-in-the-loop 决策；Human Reasoning 始终是最大视觉模块。</text></svg>