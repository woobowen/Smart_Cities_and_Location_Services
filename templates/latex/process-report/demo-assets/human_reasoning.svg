<rect width="100%" height="100%" fill="#FCFAF7"/>
<text x="72" y="70" font-family="Noto Sans CJK SC, Noto Sans CJK, Arial, sans-serif" font-size="20" font-weight="600" fill="#70757A" text-anchor="start" opacity="1">SMART CITIES &amp; LOCATION SERVICES</text>
<text x="1612" y="70" font-family="Noto Sans CJK SC, Noto Sans CJK, Arial, sans-serif" font-size="20" font-weight="400" fill="#70757A" text-anchor="end" opacity="1">Process Diagram Study v3 · 2/4</text>
<text x="72" y="138" font-family="Noto Sans CJK SC, Noto Sans CJK, Arial, sans-serif" font-size="44" font-weight="800" fill="#2D3238" text-anchor="start" opacity="1">方案 4 精修：Human Reasoning → Evidence → Decision</text>
<text x="72" y="180" font-family="Noto Sans CJK SC, Noto Sans CJK, Arial, sans-serif" font-size="21" font-weight="400" fill="#70757A" text-anchor="start" opacity="1">把“用户发现 - 判断 - 建议”放在视觉中心，GPT 提议与证据作为前后支撑。</text>
