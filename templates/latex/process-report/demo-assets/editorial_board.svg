<text x="1612" y="70" font-family="Noto Sans CJK SC, Noto Sans CJK, Arial, sans-serif" font-size="20" font-weight="400" fill="#70757A" text-anchor="end" opacity="1">Process Diagram Study v3 · 1/4</text>
<text x="72" y="138" font-family="Noto Sans CJK SC, Noto Sans CJK, Arial, sans-serif" font-size="44" font-weight="800" fill="#2D3238" text-anchor="start" opacity="1">方案 2 精修：Editorial Decision Board</text>
<text x="72" y="180" font-family="Noto Sans CJK SC, Noto Sans CJK, Arial, sans-serif" font-size="21" font-weight="400" fill="#70757A" text-anchor="start" opacity="1">一页讲清“问题 - 人的判断 - 验证 - 决定”，减少箭头，用编辑式对齐建立阅读顺序。</text>
