<rect x="72" y="244" width="1540" height="82" rx="14" fill="white" stroke="#DDE3E7" stroke-width="1.5"/><rect x="92" y="261" width="7" height="48" rx="3.5" fill="#5B9FBE"/><text x="116" y="278" font-family="Noto Sans CJK SC, Noto Sans CJK, Arial, sans-serif" font-size="18" font-weight="700" fill="#5B9FBE" text-anchor="start" opacity="1">研究问题</text><text x="116" y="308" font-family="Noto Sans CJK SC, Noto Sans CJK, Arial, sans-serif" font-size="28" font-weight="700" fill="#2D3238" text-anchor="start" opacity="1">统一阈值是否适合所有轨迹类型？</text><text x="90" y="385" font-family="Noto Sans CJK SC, Noto Sans CJK, Arial, sans-serif" font-size="56" font-weight="800" fill="#DDE3E7" text-anchor="start" opacity="1">01</text><rect x="90" y="416" width="315" height="250" rx="16" fill="white" stroke="#DDE3E7" stroke-width="1.7"/><rect x="108" y="438" width="7" height="184" rx="3.5" fill="#5B9FBE"/><text x="132" y="466" font-family="Noto Sans CJK SC, Noto Sans CJK, Arial, sans-serif" font-size="22" font-weight="700" fill="#5B9FBE" text-anchor="start" opacity="1">GPT 初始建议</text><text x="132" y="520" font-family="Noto Sans CJK SC, Noto Sans CJK, Arial, sans-serif" font-size="28" font-weight="500" fill="#2D3238" text-anchor="start"><tspan x="132" dy="0">全部轨迹使用</tspan><tspan x="132" dy="37.800000000000004">统一阈值。</tspan></text><text x="475" y="385" font-family="Noto Sans CJK SC, Noto Sans CJK, Arial, sans-serif" font-size="56" font-weight="800" fill="#DDE3E7" text-anchor="start" opacity="1">02</text><rect x="475" y="416" width="315" height="250" rx="16" fill="white" stroke="#DDE3E7" stroke-width="1.7"/><rect x="493" y="438" width="7" height="184" rx="3.5" fill="#D49757"/><text x="517" y="466" font-family="Noto Sans CJK SC, Noto Sans CJK, Arial, sans-serif" font-size="22" font-weight="700" fill="#D49757" text-anchor="start" opacity="1">用户发现的问题</text><text x="517" y="520" font-family="Noto Sans CJK SC, Noto Sans CJK, Arial, sans-serif" font-size="28" font-weight="500" fill="#2D3238" text-anchor="start"><tspan x="517" dy="0">静止与行驶轨迹</tspan><tspan x="517" dy="37.800000000000004">分布差异明显。</tspan></text><text x="860" y="385" font-family="Noto Sans CJK SC, Noto Sans CJK, Arial, sans-serif" font-size="56" font-weight="800" fill="#DDE3E7" text-anchor="start" opacity="1">03</text><rect x="860" y="416" width="315" height="250" rx="16" fill="white" stroke="#DDE3E7" stroke-width="1.7"/><rect x="878" y="438" width="7" height="184" rx="3.5" fill="#D49757"/><text x="902" y="466" font-family="Noto Sans CJK SC, Noto Sans CJK, Arial, sans-serif" font-size="22" font-weight="700" fill="#D49757" text-anchor="start" opacity="1">用户提出建议</text><text x="902" y="520" font-family="Noto Sans CJK SC, Noto Sans CJK, Arial, sans-serif" font-size="28" font-weight="500" fill="#2D3238" text-anchor="start"><tspan x="902" dy="0">增加“分类参数”方案</tspan><tspan x="902" dy="37.800000000000004">作为对照。</tspan></text><text x="1245" y="385" font-family="Noto Sans CJK SC, Noto Sans CJK, Arial, sans-serif" font-size="56" font-weight="800" fill="#DDE3E7" text-anchor="start" opacity="1">04</text><rect x="1245" y="416" width="315" height="250" rx="16" fill="white" stroke="#DDE3E7" stroke-width="1.7"/><rect x="1263" y="438" width="7" height="184" rx="3.5" fill="#8177A8"/><text x="1287" y="466" font-family="Noto Sans CJK SC, Noto Sans CJK, Arial, sans-serif" font-size="22" font-weight="700" fill="#8177A8" text-anchor="start" opacity="1">验证与决定</text><text x="1287" y="520" font-family="Noto Sans CJK SC, Noto Sans CJK, Arial, sans-serif" font-size="28" font-weight="500" fill="#2D3238" text-anchor="start"><tspan x="1287" dy="0">公平 A/B 实验后</tspan><tspan x="1287" dy="37.800000000000004">再冻结方案。</tspan></text><rect x="90" y="724" width="1470" height="214" rx="16" fill="white" stroke="#DDE3E7" stroke-width="1.7"/><rect x="112" y="746" width="182" height="38" rx="19" fill="white" stroke="#8177A8" stroke-width="1.8"/><text x="127" y="772" font-family="Noto Sans CJK SC, Noto Sans CJK, Arial, sans-serif" font-size="18" font-weight="700" fill="#8177A8" text-anchor="start" opacity="1">EVIDENCE</text><text x="112" y="814" font-family="Noto Sans CJK SC, Noto Sans CJK, Arial, sans-serif" font-size="26" font-weight="650" fill="#2D3238" text-anchor="start" opacity="1">资料 / 数据分布 / 参数敏感性实验</text><text x="112" y="858" font-family="Noto Sans CJK SC, Noto Sans CJK, Arial, sans-serif" font-size="23" font-weight="400" fill="#70757A" text-anchor="start" opacity="1">只在证据足够时进入最终方法；若结果不支持用户建议，也必须如实保留。</text><rect x="90" y="974" width="1470" height="92" rx="14" fill="#D7D3EA" stroke="#8177A8" stroke-width="1.8"/><text x="118" y="1014" font-family="Noto Sans CJK SC, Noto Sans CJK, Arial, sans-serif" font-size="19" font-weight="800" fill="#8177A8" text-anchor="start" opacity="1">最终决定</text><text x="270" y="1014" font-family="Noto Sans CJK SC, Noto Sans CJK, Arial, sans-serif" font-size="27" font-weight="700" fill="#2D3238" text-anchor="start" opacity="1">由实验结果而不是对话偏好裁决；用户负责解释与最终确认。</text><line x1="72" y1="1110" x2="1612" y2="1110" stroke="#DDE3E7" stroke-width="1.5"/><text x="72" y="1146" font-family="Noto Sans CJK SC, Noto Sans CJK, Arial, sans-serif" font-size="18" font-weight="400" fill="#70757A" text-anchor="start" opacity="1">适用：单个重要决策的一页式总结；重点在“人提出了什么”，而不是把所有步骤都做成彩色卡片。</text></svg>