  <text x="794" y="642" fill="#2D3238" font-family="DejaVu Sans,sans-serif" font-size="20">Negative results retained</text>
  <text x="49" y="748" fill="#2D3238" font-family="DejaVu Sans,sans-serif" font-size="17">Static, single-use online and sequential fleet models keep separate definitions and units.</text>
  <text x="49" y="772" fill="#2D3238" font-family="DejaVu Sans,sans-serif" font-size="17">Arrows show data and control. Technical structure is separate from historical chat evidence.</text>
